<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2e6"/>
      <stop offset="1" stop-color="#ece4d2"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#paper)"/>
  <g stroke="#2b2a26" stroke-opacity=".22" fill="none" stroke-width="1.5">
    <path d="M170 330 H740 M170 520 H740 M170 710 H740"/>
    <path d="M330 330 V520 M560 330 V520 M330 520 V710 M560 520 V710"/>
  </g>
  <g fill="#2b2a26" fill-opacity=".5">
    <circle cx="170" cy="330" r="9"/><circle cx="740" cy="330" r="9"/>
    <circle cx="330" cy="520" r="9"/><circle cx="560" cy="520" r="9"/>
    <circle cx="330" cy="710" r="9"/><circle cx="560" cy="710" r="9"/>
  </g>
  <g stroke="#8a2f25" stroke-width="3" fill="none">
    <rect x="90" y="92" width="58" height="58"/>
  </g>
  <text x="119" y="131" fill="#8a2f25" font-family="Georgia, serif" font-size="26" text-anchor="middle">AI</text>
  <g fill="#2b2a26" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="6">
    <text x="90" y="1010">COURSEWORK · 2026</text>
  </g>
  <g fill="#2b2a26" fill-opacity=".62" font-family="Georgia, serif" font-size="14" letter-spacing="2">
